services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/reactumlapp
      - SPRING_PROFILES_ACTIVE=test


  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PW}
      MYSQL_DATABASE: reactumlapp

