version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:4173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080

  backend:
    build: ./backend
    ports:
      - "8080:8080"
      - "5005:5005" #Debugger port
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/reactumlapp
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PW}
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

  mysql:
    image: mysql:8.0
    #container_name: mysql-docker
    ports:
      - "3307:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PW}
      MYSQL_DATABASE: reactumlapp
